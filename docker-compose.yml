services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dp1_feed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/postgres18-entrypoint.sh:/usr/local/bin/dp1-postgres-entrypoint:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/dp1-postgres-entrypoint"]
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Preserve the 15-second HTTP drain and 105-second remote-log drain.
    stop_grace_period: 120s
    ports:
      - "8787:8787"
    env_file:
      - config/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
