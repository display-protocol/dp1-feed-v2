openapi: 3.1.0
info:
  title: DP-1 Feed V2
  version: 0.1.0
  description: |
    REST API for DP-1 playlists, playlist-groups, channels, and curated channel registry.
    
    This service provides:
    - DP-1 playlist management with v1.1+ multisig support
    - Playlist-group (exhibition) composition
    - Channel management (requires extensions enabled)
    - Playlist item indexing and querying
    - Curated channel registry (read-only over the API)

    Authentication: signatures only — there is no API key. Every mutating request is authorized by the
    cryptographic signatures it carries. POST (create) is open: the body must be validly self-signed by a
    key it declares in `curators`/`publisher`. PUT (replace) and DELETE are owner-bound: the request must
    be signed by a key the *stored* document already names as an owner, and the owner set is immutable on
    replace. The feed always adds its own `feed` signature. There is no PATCH, and the registry has no
    write endpoint.

    Because an owner's signatures live inside the document and are public via GET, a previously published
    document could otherwise be replayed. PUT and DELETE therefore also carry a **signed mutation-intent**
    (`SignedIntent`) whose `created` is inside the signed payload — the per-signature `ts` is not covered
    by the signature and so cannot bound replay. PUT sends `SignedReplaceRequest` (the document plus an
    intent bound to its `payloadHash`); DELETE sends `SignedDeleteRequest`. Intents must be fresh within
    `auth.intent_max_clock_skew`. Deleted ids are tombstoned and cannot be re-created (`409`), which is
    what stops a captured document from resurrecting a deleted resource; CREATE itself stays open so
    cross-feed mirroring keeps working.

    Documents are stored and served verbatim. DP-1 §7.1 binds every signature to the JCS form of the
    whole document, so the feed verifies over the bytes you sent, appends its `feed` entry to
    `signatures`, and persists and returns those bytes unchanged — it never derives a slug, mints item
    ids, re-formats `created`, injects defaults, or strips a legacy `signature`. Consequently every
    field the document needs must be present and signed by you, and request bodies are decoded
    **strictly**: an unknown or misspelled member, or a body holding more than one JSON value, is a
    `400` naming the field rather than being silently dropped.

    On PUT the identity (`id`, `slug`, and document `created`) is **validated for equality** against the
    stored resource, not substituted — a mismatch is a `400`. Request bodies are capped
    (`server.max_request_bytes`); exceeding it is a `413`.

servers:
  - url: http://localhost:8787
    description: Local development

tags:
  - name: health
    description: Health check endpoints
  - name: playlists
    description: DP-1 playlist management
  - name: playlist-groups
    description: DP-1 playlist-group (exhibition) management
  - name: channels
    description: DP-1 channel management (extensions)
  - name: playlist-items
    description: Indexed playlist items
  - name: registry
    description: Curated channel registry

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Liveness endpoint (no auth required)
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string

  /api/v1:
    get:
      tags: [health]
      summary: API information
      description: Returns deployment metadata and available endpoints
      responses:
        '200':
          description: API metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  description:
                    type: string
                  specification:
                    type: string
                  extensionsEnabled:
                    type: boolean
                  endpoints:
                    type: object

  /api/v1/health:
    get:
      tags: [health]
      summary: API health check
      description: Same as /health but under API namespace
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  version:
                    type: string

  /api/v1/playlists:
    get:
      tags: [playlists]
      summary: List playlists
      description: Returns paginated list of playlists ordered by created_at
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: channel
          in: query
          description: Filter by channel UUID or slug (membership). Requires extensions when used.
          schema:
            type: string
        - name: playlist-group
          in: query
          description: Filter by playlist-group UUID or slug (mutually exclusive with channel)
          schema:
            type: string
      responses:
        '200':
          description: List of playlists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Extensions disabled (when filtering by channel)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [playlists]
      summary: Create playlist
      description: >-
        Creates a new DP-1 playlist. Open to any client: the body must carry a non-empty `signatures`
        array with a valid curator signature over the document. The feed adds its `feed` signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistInput'
      responses:
        '201':
          description: Playlist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DeletedIdConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/v1/playlists/{id}:
    get:
      tags: [playlists]
      summary: Get playlist
      description: |
        Returns a single playlist by UUID or slug.

        Responses include a strong `ETag` (SHA-256 of the UTF-8 JSON body). Clients may send `If-None-Match`
        with a previously received ETag to receive 304 Not Modified when the representation is unchanged.
        Paginated list GETs do not emit ETag in API v1.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Playlist document
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '304':
          description: Not Modified — If-None-Match matched the current ETag; response body is empty
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [playlists]
      summary: Replace playlist
      description: >-
        Fully replaces a playlist. The body is a `SignedReplaceRequest`: the full re-signed `document`
        plus an `authorization` intent bound to that document's `payloadHash`. Owner-bound and immutable:
        the document must be signed by a key the stored playlist lists in `curators`, the `curators` set
        may not change, and the identity (`id`, `slug`, `created`) must equal the stored resource's. The
        intent must also be signed by a stored owner and be fresh. 403 if the signer is not an owner or the
        owner set changed; 409 if the resource changed since it was authorized.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedReplaceRequest'
      responses:
        '200':
          description: Playlist replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [playlists]
      summary: Delete playlist
      description: >-
        Deletes a playlist (fails if referenced by groups/channels). The request body is a signed
        delete-intent (`SignedDeleteRequest`) that must target this playlist and be signed by one of its
        curators within the freshness window.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedDeleteRequest'
      responses:
        '204':
          description: Playlist deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/playlist-groups:
    get:
      tags: [playlist-groups]
      summary: List playlist-groups
      description: Returns paginated list of playlist-groups (exhibitions)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of playlist-groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlaylistGroup'

    post:
      tags: [playlist-groups]
      summary: Create playlist-group
      description: >-
        Creates a new playlist-group with resolved playlist references. Open to any client: the body must
        carry a non-empty `signatures` array with a valid signature from the declared `curator`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistGroupInput'
      responses:
        '201':
          description: Playlist-group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DeletedIdConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/v1/playlist-groups/{id}:
    get:
      tags: [playlist-groups]
      summary: Get playlist-group
      description: |
        Returns a single playlist-group by UUID or slug.

        Strong ETag and optional conditional GET (`If-None-Match` → 304) apply as for single-resource GETs;
        list endpoints do not emit ETag in API v1.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Playlist-group document
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistGroup'
        '304':
          description: Not Modified — If-None-Match matched the current ETag; response body is empty
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [playlist-groups]
      summary: Replace playlist-group
      description: >-
        Fully replaces a playlist-group. The body is a `SignedReplaceRequest`: the full re-signed
        `document` plus an `authorization` intent bound to its `payloadHash`. Owner-bound and immutable:
        the document and the intent must both be signed by the stored `curator`, which may not change, and
        the identity must equal the stored resource's. 403 if the signer is not the owner or the owner
        changed; 409 if the resource changed since it was authorized.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedReplaceRequest'
      responses:
        '200':
          description: Playlist-group replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [playlist-groups]
      summary: Delete playlist-group
      description: >-
        Deletes a playlist-group (cascades membership). The request body is a signed delete-intent
        (`SignedDeleteRequest`) that must target this group and be signed by its `curator` within the
        freshness window.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedDeleteRequest'
      responses:
        '204':
          description: Playlist-group deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels:
    get:
      tags: [channels]
      summary: List channels
      description: Returns paginated list of channels (requires extensions enabled)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/ExtensionsDisabled'

    post:
      tags: [channels]
      summary: Create channel
      description: >-
        Creates a new channel with resolved playlist references (requires extensions). Open to any client:
        the body must carry a non-empty `signatures` array with a valid signature from the declared
        `publisher`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DeletedIdConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '404':
          $ref: '#/components/responses/ExtensionsDisabled'

  /api/v1/channels/{id}:
    get:
      tags: [channels]
      summary: Get channel
      description: |
        Returns a single channel by UUID or slug (requires extensions).

        Strong ETag and optional `If-None-Match` (304) apply as for other single-resource GETs.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Channel document
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '304':
          description: Not Modified — If-None-Match matched the current ETag; response body is empty
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
        '404':
          description: Channel not found or extensions disabled

    put:
      tags: [channels]
      summary: Replace channel
      description: >-
        Fully replaces a channel (requires extensions). The body is a `SignedReplaceRequest`: the full
        re-signed `document` plus an `authorization` intent bound to its `payloadHash`. Owner-bound and
        immutable: the document and the intent must both be signed by the stored `publisher`, which may not
        change, and the identity must equal the stored resource's (`curators` may change). 403 if the signer
        is not the publisher or the publisher changed; 409 if the resource changed since it was authorized.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedReplaceRequest'
      responses:
        '200':
          description: Channel replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Channel not found or extensions disabled

    delete:
      tags: [channels]
      summary: Delete channel
      description: >-
        Deletes a channel (cascades membership, requires extensions). The request body is a signed
        delete-intent (`SignedDeleteRequest`) that must target this channel and be signed by its
        `publisher` within the freshness window.
      parameters:
        - $ref: '#/components/parameters/IdOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedDeleteRequest'
      responses:
        '204':
          description: Channel deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Channel not found or extensions disabled

  /api/v1/playlist-items:
    get:
      tags: [playlist-items]
      summary: List playlist items
      description: Returns paginated indexed items across all playlists, optionally filtered
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: channel
          in: query
          description: Filter by channel UUID or slug
          schema:
            type: string
        - name: playlist-group
          in: query
          description: Filter by playlist-group UUID or slug (mutually exclusive with channel)
          schema:
            type: string
      responses:
        '200':
          description: List of playlist items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlaylistItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/playlist-items/{id}:
    get:
      tags: [playlist-items]
      summary: Get playlist item
      description: |
        Returns a single indexed playlist item by UUID.

        Strong ETag and optional `If-None-Match` (304) apply; the playlist-items list GET does not emit ETag in API v1.
      parameters:
        - name: id
          in: path
          required: true
          description: Playlist item UUID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Playlist item
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '304':
          description: Not Modified — If-None-Match matched the current ETag; response body is empty
          headers:
            ETag:
              $ref: '#/components/headers/IndividualGETETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/registry/channels:
    get:
      tags: [registry]
      summary: Get curated channel registry
      description: Returns an ordered list of publishers, each with an optional DID and an ordered channel URL list
      responses:
        '200':
          description: Curated registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelRegistry'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    IdOrSlug:
      name: id
      in: path
      required: true
      description: Resource UUID or slug
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum items to return (1-100, default 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100

    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from previous response
      schema:
        type: string

    Sort:
      name: sort
      in: query
      description: Sort order by created_at
      schema:
        type: string
        enum: [asc, desc]
        default: asc

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        Optional conditional GET. When it matches the ETag of the current representation, the server returns
        304 Not Modified with an empty body. Only single-resource GETs support this (not list or registry GETs);
        see docs/api_design.md.
      schema:
        type: string

  headers:
    IndividualGETETag:
      description: >
        Strong entity-tag for the exact UTF-8 JSON response bytes: a quoted hexadecimal SHA-256 digest.
        Send the same value in If-None-Match for conditional GETs.
      schema:
        type: string

  schemas:
    ListResponse:
      type: object
      required:
        - items
        - hasMore
      properties:
        items:
          type: array
          description: Array of items (type varies by endpoint)
        cursor:
          type: string
          description: Cursor for next page (omitted if no more pages)
        hasMore:
          type: boolean
          description: Whether more items are available

    PlaylistInput:
      type: object
      description: >-
        Create (POST) / replace (PUT) body for a playlist. Authorization is signature-only: `id`,
        `created`, `slug`, `curators`, and a matching `signatures` entry are all required, and the feed
        stores them verbatim (it does not derive a slug or mint item ids after signing). On PUT the
        identity (`id`, `slug`, document `created`) and the `curators` owner set are immutable and must
        equal the stored document.
      required:
        - dpVersion
        - id
        - created
        - slug
        - title
        - items
        - curators
        - signatures
      properties:
        dpVersion:
          type: string
          example: "1.1.0"
        id:
          type: string
          format: uuid
          description: Client-assigned UUID; part of the signed document and the resource identity.
        created:
          type: string
          format: date-time
          description: RFC3339 timestamp, not in the future; part of the signed document.
        slug:
          type: string
          description: URL identifier, taken verbatim (not derived); immutable on PUT.
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistItemInput'
        curators:
          type: array
          description: Declared owners; a signature whose kid matches a curator key authorizes the write.
          items:
            $ref: '#/components/schemas/Entity'
        summary:
          type: string
        coverImage:
          type: string
          format: uri
        defaults:
          type: object
        note:
          $ref: '#/components/schemas/Note'
        dynamicQuery:
          type: object
        signature:
          type: string
          deprecated: true
          description: >-
            Deprecated v1.0.x single signature. Accepted so a document carrying one is not rejected by
            strict decoding; it is preserved verbatim and never stripped (DP-1 §7.1.3 has players prefer
            `signatures` when both are present).
        signatures:
          type: array
          minItems: 1
          description: >-
            Curator signatures over the document (JCS, signatures stripped). At least one kid must match a
            `curators` key. The feed always appends its own `feed` signature after verification.
          items:
            $ref: '#/components/schemas/Signature'

    PlaylistItemInput:
      type: object
      required:
        - id
        - source
      properties:
        id:
          type: string
          format: uuid
          description: Client-assigned UUID; required because the item is part of the signed document (the feed never mints it).
        source:
          type: string
          format: uri
        title:
          type: string
        duration:
          type: number
        license:
          type: string
        ref:
          type: string
        override:
          type: object
        display:
          type: object
        repro:
          type: object
        provenance:
          type: object
        note:
          $ref: '#/components/schemas/Note'
        displayAt:
          type: string
          description: >-
            Optional ISO 8601 datetime for Playlist Extension displayAt scheduling (§3.5.2).
            When playlist extension validation is enabled, accepted forms are local datetime with seconds
            and no timezone (2026-07-21T00:00:00, display-locale local), or absolute RFC 3339 date-time
            with Z or colon offset (e.g. +07:00). Date-only (YYYY-MM-DD) and compact offset without
            colon are not accepted by that extension validator. Stored as item metadata; this feed does
            not compute playback eligibility.
          example: "2026-07-21T00:00:00"
        inlineManifest:
          description: >-
            Optional complete DP-1 Ref Manifest carried on the item instead of behind `ref` (Playlist
            Extension §3.6). Its shape is the DP-1 ref-manifest schema and is deliberately not
            restated here, so this document cannot drift from a schema it does not own (that schema
            changed in dp1-go v0.6.0, when thumbnail `w`/`h` became optional).
            When playlist extension validation is enabled the manifest is validated against that
            schema — which requires `refVersion`, `id`, `created`, and `locale` — and a malformed one
            fails the request with 400. With extensions off the deployment does not implement the
            extension: the core schema does not describe this field, core DP-1 tolerates unknown
            ones, and whatever was sent is stored and returned unchecked — a string, an array or
            null are all accepted there. That is why this property declares no `type`: any type
            constraint would hold in one deployment mode and not the other, and OpenAPI cannot
            express the difference.
            The manifest is not returned byte-identical to the one submitted — signing and JSONB
            storage re-encode it — so do not hash, diff, or cache the returned blob.
            This feed does not fetch `ref`, merge the two, or apply the §3.6
            precedence (a fetched `ref` manifest wins over the inline copy) — players resolve that.
            The manifest is part of the signed payload, with no `refHash` counterpart of its own.
            Two distinct size limits apply. Inbound request bodies are capped by
            `server.max_request_bytes` (default 5 MiB); exceeding it is `413`. Separately,
            `playlist.fetch_max_body_bytes` (default 4 MiB) caps playlists this feed *fetches* when
            ingesting a group or channel by URL — so a playlist with large inline manifests can be
            publishable directly yet too large for another deployment to ingest.

    Playlist:
      type: object
      description: DP-1 playlist document (includes signatures)
      properties:
        dpVersion:
          type: string
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistItem'
        note:
          $ref: '#/components/schemas/Note'
        signatures:
          type: array
          description: v1.1+ multisig array
        # Additional fields...

    PlaylistItem:
      type: object
      required:
        - id
        - source
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uri
        title:
          type: string
        created:
          type: string
          format: date-time
        duration:
          type: number
        note:
          $ref: '#/components/schemas/Note'
        displayAt:
          type: string
          description: >-
            Optional ISO 8601 datetime for Playlist Extension displayAt scheduling (§3.5.2).
            Under playlist extension validation, same accepted forms as PlaylistItemInput.displayAt.
          example: "2026-07-21T00:00:00"
        inlineManifest:
          description: >-
            Optional complete DP-1 Ref Manifest carried on the item (Playlist Extension §3.6).
            Same shape, validation, and handling as PlaylistItemInput.inlineManifest.
        # Additional fields...

    PlaylistGroupInput:
      type: object
      description: >-
        Create (POST) / replace (PUT) body for a playlist-group. Signature-only: `id`, `created`, `slug`,
        `curator`, and a matching `signatures` entry are required and stored verbatim. On PUT the identity
        (`id`, `slug`, document `created`) and the `curator` owner are immutable.
      required:
        - id
        - created
        - slug
        - title
        - playlists
        - curator
        - signatures
      properties:
        id:
          type: string
          format: uuid
          description: Client-assigned UUID; part of the signed document and identity.
        created:
          type: string
          format: date-time
          description: RFC3339 timestamp, not in the future; part of the signed document.
        slug:
          type: string
          description: URL identifier, taken verbatim (not derived); immutable on PUT.
        title:
          type: string
        playlists:
          type: array
          description: Array of playlist URIs or slugs
          items:
            type: string
        curator:
          type: string
          description: did:key of the owner; a signature whose kid matches it authorizes the write.
        summary:
          type: string
        coverImage:
          type: string
          format: uri
        signature:
          type: string
          deprecated: true
          description: >-
            Deprecated v1.0.x single signature. Accepted so a document carrying one is not rejected by
            strict decoding; it is preserved verbatim and never stripped (DP-1 §7.1.3 has players prefer
            `signatures` when both are present).
        signatures:
          type: array
          minItems: 1
          description: >-
            Curator signatures over the document. At least one kid must equal `curator`. The feed appends
            its own `feed` signature after verification.
          items:
            $ref: '#/components/schemas/Signature'

    PlaylistGroup:
      type: object
      description: DP-1 playlist-group document
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        playlists:
          type: array
          items:
            type: string
        # Additional fields...

    ChannelInput:
      type: object
      description: >-
        Create (POST) / replace (PUT) body for a channel (requires extensions). Signature-only: `id`,
        `created`, `slug`, `publisher`, and a matching `signatures` entry are required and stored verbatim.
        On PUT the identity (`id`, `slug`, document `created`) and the `publisher` owner are immutable;
        `curators` may change.
      required:
        - id
        - created
        - slug
        - title
        - version
        - playlists
        - publisher
        - signatures
      properties:
        id:
          type: string
          format: uuid
          description: Client-assigned UUID; part of the signed document and identity.
        created:
          type: string
          format: date-time
          description: RFC3339 timestamp, not in the future; part of the signed document.
        slug:
          type: string
          description: URL identifier, taken verbatim (not derived); immutable on PUT.
        title:
          type: string
        version:
          type: string
          description: >-
            Required. The feed no longer injects a default: it stores the document you signed verbatim,
            so a value it added after signing would orphan your signature.
          example: "1.0.0"
        playlists:
          type: array
          description: Array of playlist URIs or slugs
          items:
            type: string
        curators:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        publisher:
          allOf:
            - $ref: '#/components/schemas/Entity'
          description: The channel owner; a signature whose kid matches its key authorizes the write.
        summary:
          type: string
        coverImage:
          type: string
          format: uri
        signature:
          type: string
          deprecated: true
          description: >-
            Deprecated v1.0.x single signature. Accepted so a document carrying one is not rejected by
            strict decoding; it is preserved verbatim and never stripped (DP-1 §7.1.3 has players prefer
            `signatures` when both are present).
        signatures:
          type: array
          minItems: 1
          description: >-
            Publisher signatures over the document. At least one kid must equal the publisher key. The feed
            appends its own `feed` signature after verification.
          items:
            $ref: '#/components/schemas/Signature'

    Channel:
      type: object
      description: DP-1 channel document (extensions)
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        version:
          type: string
        playlists:
          type: array
          items:
            type: string
        # Additional fields...

    ChannelRegistry:
      type: object
      required:
        - publishers
      properties:
        publishers:
          type: array
          minItems: 0
          maxItems: 1000
          description: Ordered publishers (GET may be empty; PUT requires at least one publisher)
          items:
            $ref: '#/components/schemas/ChannelRegistryPublisher'

    ChannelRegistryPublisher:
      type: object
      required:
        - name
        - channel_urls
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Publisher name (unique within the registry)
        did:
          type: string
          maxLength: 2048
          description: Optional publisher DID
        channel_urls:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uri
            pattern: '\/api\/v1\/channels\/[0-9a-f-]{36}$'
          description: Ordered channel URLs (GET may return an empty array; PUT requires at least one)

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message

    Signature:
      type: object
      description: DP-1 v1.1+ multisig signature (see DP-1 spec §7.1.1)
      required:
        - alg
        - kid
        - ts
        - payload_hash
        - role
        - sig
      properties:
        alg:
          type: string
          description: Signature algorithm
          example: "ed25519"
        kid:
          type: string
          description: DID key identifier (e.g., did:key:z6Mk...)
          example: "did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK"
        ts:
          type: string
          format: date-time
          description: RFC3339 timestamp when signature was created
          example: "2025-06-01T12:00:00Z"
        payload_hash:
          type: string
          description: SHA-256 hash of the canonicalized JSON payload (JCS)
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        role:
          type: string
          description: Role of the signer
          enum: ["curator", "feed", "agent", "institution", "licensor", "publisher"]
          example: "curator"
        sig:
          type: string
          description: Base64-encoded signature
          example: "dGVzdC1zaWduYXR1cmU="

    IntentTarget:
      type: object
      description: Binds an intent to exactly one stored resource; every field is checked against the stored row.
      required: [type, id, slug]
      properties:
        type:
          type: string
          enum: ["playlist", "playlist-group", "channel"]
        id:
          type: string
          format: uuid
        slug:
          type: string

    SignedIntent:
      type: object
      description: >-
        A signed mutation-intent: the feed-local envelope that authorizes a mutation of an EXISTING
        resource (DP-1 defines no such document, so this shape is the feed's).


        Why it exists: an owner's signatures live inside the document and are public via GET, so an
        observer could replay a previously published document — PUT it to roll a resource back to an older
        version, or POST it after a delete to resurrect it. The per-signature `ts` cannot bound that
        replay, because `ts` is NOT covered by the signature (`sig` is computed over the JCS form of the
        document with `signatures` stripped), so it can be rewritten on a replayed body. Only a value
        inside a signed payload is trustworthy — hence the intent carries its own `created` and is signed
        as its own small document. Because the bound is wall-clock rather than per-feed bookkeeping, a
        stale intent is stale on every feed, which is what makes this hold for documents mirrored across
        feeds.


        The server verifies the signatures over the intent bytes (§7.1 digest, `signatures` stripped),
        requires a signer whose kid is an owner of the STORED resource (curator for playlists/groups,
        publisher for channels), and rejects a `created` outside `auth.intent_max_clock_skew`.
      required: [action, target, created, signatures]
      properties:
        action:
          type: string
          enum: ["replace", "delete"]
          description: The mutation this intent authorizes; must match the request method.
        target:
          $ref: '#/components/schemas/IntentTarget'
        payloadHash:
          type: string
          description: >-
            DP-1 signing digest of the document this intent authorizes, binding the intent to that exact
            content so a captured intent cannot install different bytes. Required when `action` is
            "replace"; omitted for "delete", which carries no document.
          example: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        created:
          type: string
          format: date-time
          description: RFC3339; must be within `auth.intent_max_clock_skew` of server time.
          example: "2025-06-01T12:00:00Z"
        signatures:
          type: array
          minItems: 1
          description: Owner signatures over the intent (JCS with `signatures` removed).
          items:
            $ref: '#/components/schemas/Signature'

    SignedDeleteRequest:
      description: >-
        The DELETE body — a bare signed intent whose `action` is "delete", with no `payloadHash`.
      allOf:
        - $ref: '#/components/schemas/SignedIntent'

    SignedReplaceRequest:
      type: object
      description: >-
        The PUT body. It pairs the full signed replacement document with the intent that authorizes
        replacing this resource with it. Both are verified independently: the document by its own owner
        signatures (and stored verbatim), the intent by its signatures plus freshness and `payloadHash`
        binding. One without the other authorizes nothing.
      required: [document, authorization]
      properties:
        document:
          description: >-
            The complete signed replacement document (`PlaylistInput` / `PlaylistGroupInput` /
            `ChannelInput` shape for the route). Stored and served verbatim.
          type: object
        authorization:
          allOf:
            - $ref: '#/components/schemas/SignedIntent'
          description: >-
            Signed intent whose `action` is "replace", with `payloadHash` set to the document's digest.

    Note:
      type: object
      description: Text note with optional display duration (playlists extension)
      required:
        - text
      properties:
        text:
          type: string
          description: Note content
          example: "This is a note about the playlist or item"
        duration:
          type: number
          format: float
          description: Display duration in seconds (defaults to 20 when omitted)
          example: 15.0

    Entity:
      type: object
      description: >-
        A curator or publisher identity. `key` is a did:key; it is the value a signature's `kid` must
        match to authorize a write on the resource that declares this entity as an owner.
      required:
        - key
      properties:
        name:
          type: string
        key:
          type: string
          description: did:key identifier of the owner.
          example: "did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK"
        url:
          type: string
          format: uri

  responses:
    BadRequest:
      description: Bad request (validation error, or signature verification failure)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                error: bad_request
                message: Invalid input
            invalid_timestamp:
              value:
                error: invalid_timestamp
                message: Timestamp cannot be in the future
            invalid_id:
              value:
                error: invalid_id
                message: ID must be a valid UUID
            signature_verification_failed:
              value:
                error: signature_verification_failed
                message: Signature cryptographic verification failed

    Unauthorized:
      description: Missing authentication — the request body carried no signatures
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
            message: "missing authentication: request body must carry signatures"

    Forbidden:
      description: >-
        The signature is valid but the signer is not an owner of the resource, or a replace attempted to
        change the immutable owner set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_owner:
              value:
                error: forbidden
                message: request is not signed by an owner of the resource
            owner_immutable:
              value:
                error: forbidden
                message: resource owner is immutable and cannot be changed

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: not_found
            message: Resource not found

    Conflict:
      description: >-
        The resource changed between the request being authorized and the write being applied (a
        concurrent write, or the row was deleted and re-created). Re-read the current document and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: conflict
            message: the resource changed since it was authorized; re-read and retry

    DeletedIdConflict:
      description: >-
        The `id` names a document this feed has already deleted. Ids are not reusable, so a tombstoned id
        cannot be re-created — this is what stops a previously published document from being replayed to
        resurrect a deleted resource. Create the resource under a new id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: conflict
            message: document id was deleted and cannot be reused

    PayloadTooLarge:
      description: The request body exceeds the configured size limit (server.max_request_bytes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: payload_too_large
            message: request body exceeds the configured size limit

    ExtensionsDisabled:
      description: DP-1 extensions are disabled on this deployment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: extensions_disabled
            message: DP-1 extensions are disabled on this deployment

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal_error
            message: An unexpected error occurred
